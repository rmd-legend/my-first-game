<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Adventure World</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#050817;font-family:Arial;color:white;touch-action:none}
canvas{display:block}
#title{position:fixed;top:14px;left:16px;font-size:17px;font-weight:bold;letter-spacing:2px;text-shadow:0 2px 8px #000;pointer-events:none}
#status{position:fixed;top:42px;left:16px;font-size:11px;color:#cbd8ff;text-shadow:0 2px 5px #000;pointer-events:none}
#controls{position:fixed;bottom:20px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
.pad,.actions{display:grid;gap:8px;pointer-events:auto}
.pad{grid-template-columns:58px 58px 58px;grid-template-rows:58px 58px}
.actions{grid-template-columns:65px 65px;align-items:end}
button{border:1px solid #ffffff70;background:#111b36aa;color:white;border-radius:17px;font-size:22px;font-weight:bold;backdrop-filter:blur(8px);touch-action:none;user-select:none}
button:active{background:#4269aacc}
#up{grid-column:2}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}
.actions button{height:60px}
#run{background:#244f83cc;font-size:15px}
#jump{background:#69509acc}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#050817;color:white;font-size:18px;z-index:10}
@media(min-width:850px){#controls{opacity:.75}.pad button{width:58px;height:58px}}
</style>
</head>
<body>
<div id="loading">Creating Adventure World...</div>
<div id="title">ADVENTURE WORLD</div>
<div id="status">THE ETERNAL NIGHT • EXPLORATION</div>

<div id="controls">
  <div class="pad">
    <button id="up">▲</button>
    <button id="left">◀</button>
    <button id="down">▼</button>
    <button id="right">▶</button>
  </div>
  <div class="actions">
    <button id="run">RUN</button>
    <button id="jump">JUMP</button>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x071126);
scene.fog = new THREE.FogExp2(0x101b36,0.0025);

const camera = new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,1200);
camera.position.set(0,7,12);

const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

// NIGHT LIGHTING
scene.add(new THREE.HemisphereLight(0x9bbaff,0x17251d,1.25));

const moonLight = new THREE.DirectionalLight(0xb9d0ff,2.2);
moonLight.position.set(-80,120,40);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(2048,2048);
moonLight.shadow.camera.left=-90;
moonLight.shadow.camera.right=90;
moonLight.shadow.camera.top=90;
moonLight.shadow.camera.bottom=-90;
scene.add(moonLight);

const moon = new THREE.Mesh(
 new THREE.SphereGeometry(13,32,32),
 new THREE.MeshBasicMaterial({color:0xe5edff})
);
moon.position.set(-100,110,-220);
scene.add(moon);

// STARS
const starGeo = new THREE.BufferGeometry();
const starPositions=[];
for(let i=0;i<1300;i++){
 starPositions.push((Math.random()-.5)*900,Math.random()*260+35,(Math.random()-.5)*900);
}
starGeo.setAttribute('position',new THREE.Float32BufferAttribute(starPositions,3));
const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xffffff,size:1.1}));
scene.add(stars);

// MATERIALS
const groundMat=new THREE.MeshStandardMaterial({color:0x263d32,roughness:1});
const grassMat=new THREE.MeshStandardMaterial({color:0x35543c,roughness:1});
const trunkMat=new THREE.MeshStandardMaterial({color:0x493326});
const leafMats=[
 new THREE.MeshStandardMaterial({color:0x174532}),
 new THREE.MeshStandardMaterial({color:0x205b43}),
 new THREE.MeshStandardMaterial({color:0x286044})
];
const rockMat=new THREE.MeshStandardMaterial({color:0x56606a,roughness:1});
const waterMat=new THREE.MeshStandardMaterial({
 color:0x126a9d,roughness:.2,metalness:.3,
 transparent:true,opacity:.88
});

// DETERMINISTIC RANDOM
function rand(seed){
 let x=Math.sin(seed*127.1+311.7)*43758.5453;
 return x-Math.floor(x);
}
function heightAt(x,z){
 return Math.sin(x*.018)*2.5+
        Math.cos(z*.021)*2.2+
        Math.sin((x+z)*.012)*3+
        Math.cos((x-z)*.008)*2;
}
function riverX(z){return 30+Math.sin(z*.003)*13}

// WORLD CHUNKS: THE WORLD CONTINUES AS YOU EXPLORE
const CHUNK=160;
const chunks=new Map();
const chunkGroup=new THREE.Group();
scene.add(chunkGroup);

function makeTree(parent,x,z,scale,seed){
 const y=heightAt(x,z);
 const tree=new THREE.Group();
 tree.position.set(x,y,z);
 tree.scale.setScalar(scale);

 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.35,.55,4.5,8),trunkMat);
 trunk.position.y=2.25;
 trunk.castShadow=true;
 tree.add(trunk);

 for(let i=0;i<3;i++){
  const leaves=new THREE.Mesh(
   new THREE.ConeGeometry(3.3-i*.5,5.2,8),
   leafMats[Math.floor(rand(seed+i)*leafMats.length)]
  );
  leaves.position.y=4.5+i*1.9;
  leaves.castShadow=true;
  tree.add(leaves);
 }
 parent.add(tree);
}

function makeRock(parent,x,z,scale){
 const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(scale,1),rockMat);
 rock.position.set(x,heightAt(x,z)+scale*.45,z);
 rock.rotation.set(rand(x+z)*2,rand(x-z)*3,rand(z)*2);
 rock.castShadow=true;
 parent.add(rock);
}

function makeRiver(parent,cx,cz){
 const positions=[];
 const indices=[];
 const segments=32;
 for(let i=0;i<=segments;i++){
  const z=cz-CHUNK/2+i*(CHUNK/segments);
  const x=riverX(z);
  positions.push(x-7,.25,z,x+7,.25,z);
  if(i<segments){
   const a=i*2;
   indices.push(a,a+1,a+2,a+1,a+3,a+2);
  }
 }
 const geo=new THREE.BufferGeometry();
 geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
 geo.setIndex(indices);
 geo.computeVertexNormals();
 const river=new THREE.Mesh(geo,waterMat);
 parent.add(river);
}

function makeChunk(cx,cz){
 const key=cx+','+cz;
 if(chunks.has(key))return;

 const group=new THREE.Group();
 group.position.set(cx*CHUNK,0,cz*CHUNK);
 chunkGroup.add(group);

 const geo=new THREE.PlaneGeometry(CHUNK,CHUNK,32,32);
 geo.rotateX(-Math.PI/2);
 const pos=geo.attributes.position;
 for(let i=0;i<pos.count;i++){
  const lx=pos.getX(i)+cx*CHUNK;
  const lz=pos.getZ(i)+cz*CHUNK;
  pos.setY(i,heightAt(lx,lz));
 }
 geo.computeVertexNormals();

 const terrain=new THREE.Mesh(geo,groundMat);
 terrain.receiveShadow=true;
 group.add(terrain);

 makeRiver(group,cx,cz);

 for(let i=0;i<45;i++){
  const x=cx*CHUNK+(rand(i+cx*91+cz*17)-.5)*CHUNK;
  const z=cz*CHUNK+(rand(i*3+cx*19+cz*73)-.5)*CHUNK;
  if(Math.abs(x-riverX(z))<12)continue;
  makeTree(group,x-cx*CHUNK,z-cz*CHUNK,.7+rand(i+cx*7+cz*11)*.8,i+cx*100+cz*50);
 }

 for(let i=0;i<12;i++){
  const x=(rand(i+cx*51+cz*31)-.5)*CHUNK;
  const z=(rand(i*5+cx*13+cz*61)-.5)*CHUNK;
  if(Math.abs(x+cx*CHUNK-riverX(z+cz*CHUNK))<12)continue;
  makeRock(group,x,z,.8+rand(i+cx*2+cz*8)*1.5);
 }

 // BRIDGE AT THE STARTING RIVER CROSSING
 if(cz===0 && cx===0){
  const bridge=new THREE.Mesh(
   new THREE.BoxGeometry(28,1.1,7),
   new THREE.MeshStandardMaterial({color:0x755238,roughness:.85})
  );
  bridge.position.set(30,heightAt(30,0)+1,0);
  bridge.castShadow=true;
  group.add(bridge);

  for(let side of [-1,1]){
   for(let i=0;i<7;i++){
    const rail=new THREE.Mesh(
     new THREE.BoxGeometry(1,1.4,.45),
     trunkMat
    );
    rail.position.set(18+i*4,heightAt(30,0)+2,side*3.4);
    group.add(rail);
   }
  }
 }
 chunks.set(key,group);
}

function updateWorld(){
 const px=Math.floor(player.position.x/CHUNK);
 const pz=Math.floor(player.position.z/CHUNK);
 for(let x=px-2;x<=px+2;x++){
  for(let z=pz-2;z<=pz+2;z++)makeChunk(x,z);
 }
 for(const [key,group] of chunks){
  const [x,z]=key.split(',').map(Number);
  if(Math.abs(x-px)>3||Math.abs(z-pz)>3){
   chunkGroup.remove(group);
   group.traverse(o=>{
    if(o.geometry)o.geometry.dispose();
   });
   chunks.delete(key);
  }
 }
}

// HUMANOID PLAYER
const player=new THREE.Group();
scene.add(player);

const skin=new THREE.MeshStandardMaterial({color:0xb97955,roughness:.8});
const shirt=new THREE.MeshStandardMaterial({color:0x315b86,roughness:.85});
const pants=new THREE.MeshStandardMaterial({color:0x252c3b,roughness:.9});
const shoes=new THREE.MeshStandardMaterial({color:0x171b24});
const hair=new THREE.MeshStandardMaterial({color:0x17130f});
const eyeMat=new THREE.MeshStandardMaterial({color:0x17120e});

function capsule(parent,material,radius,length,x,y,z){
 const mesh=new THREE.Mesh(new THREE.CapsuleGeometry(radius,length,4,8),material);
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 parent.add(mesh);
 return mesh;
}

// Legs and feet with pivot joints
const legs=[];
for(const side of [-1,1]){
 const pivot=new THREE.Group();
 pivot.position.set(side*.23,1.05,0);
 player.add(pivot);
 capsule(pivot,pants,.19,.52,0,-.35,0);
 const foot=new THREE.Mesh(new THREE.BoxGeometry(.34,.18,.55),shoes);
 foot.position.set(0,-.75,-.1);
 foot.castShadow=true;
 pivot.add(foot);
 legs.push(pivot);
}

// BODY
const torso=capsule(player,shirt,.43,.55,0,2.05,0);
const neck=new THREE.Mesh(new THREE.CylinderGeometry(.13,.15,.25,12),skin);
neck.position.y=2.72;
player.add(neck);

const head=new THREE.Mesh(new THREE.SphereGeometry(.34,24,20),skin);
head.position.set(0,3.08,0);
head.scale.set(1,.98,.92);
head.castShadow=true;
player.add(head);

// Hair
const hairCap=new THREE.Mesh(new THREE.SphereGeometry(.35,20,12,0,Math.PI*2,0,Math.PI*.55),hair);
hairCap.position.set(0,3.19,0);
player.add(hairCap);

// Eyes
for(const side of [-1,1]){
 const eye=new THREE.Mesh(new THREE.SphereGeometry(.035,10,10),eyeMat);
 eye.position.set(side*.12,3.1,-.3);
 player.add(eye);
}

// ARMS
const arms=[];
for(const side of [-1,1]){
 const pivot=new THREE.Group();
 pivot.position.set(side*.51,2.43,0);
 player.add(pivot);
 capsule(pivot,shirt,.16,.48,0,-.28,0);
 capsule(pivot,skin,.13,.34,0,-.83,0);
 arms.push(pivot);
}

// Small backpack
const pack=new THREE.Mesh(
 new THREE.BoxGeometry(.48,.65,.23),
 new THREE.MeshStandardMaterial({color:0x443b30})
);
pack.position.set(0,2.15,.4);
player.add(pack);

player.position.set(0,heightAt(0,0),0);

// BIRDS
const birds=[];
const birdMat=new THREE.MeshStandardMaterial({color:0x111827,roughness:1});
for(let i=0;i<9;i++){
 const bird=new THREE.Group();
 const body=new THREE.Mesh(new THREE.SphereGeometry(.22,10,8),birdMat);
 body.scale.set(1,.45,1.5);
 bird.add(body);
 for(let side of [-1,1]){
  const wing=new THREE.Mesh(new THREE.BoxGeometry(.85,.07,.35),birdMat);
  wing.position.set(side*.42,0,0);
  bird.add(wing);
 }
 bird.position.set((Math.random()-.5)*90,22+Math.random()*22,(Math.random()-.5)*100);
 scene.add(bird);
 birds.push({bird,phase:Math.random()*6,speed:2+Math.random()*2});
}

// CLOUDS
const clouds=[];
const cloudMat=new THREE.MeshStandardMaterial({color:0x293852,roughness:1});
for(let i=0;i<18;i++){
 const cloud=new THREE.Group();
 for(let j=0;j<5;j++){
  const puff=new THREE.Mesh(
   new THREE.SphereGeometry(3+Math.random()*2,10,8),
   cloudMat
  );
  puff.position.set((j-2)*3,Math.random()*1.5,Math.random()*3);
  cloud.add(puff);
 }
 cloud.position.set((Math.random()-.5)*500,65+Math.random()*35,(Math.random()-.5)*500);
 scene.add(cloud);
 clouds.push(cloud);
}

// INPUT
const keys={};
onkeydown=e=>{keys[e.key.toLowerCase()]=true};
onkeyup=e=>{keys[e.key.toLowerCase()]=false};

function hold(id,key){
 const b=document.getElementById(id);
 b.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;b.setPointerCapture(e.pointerId)});
 const release=()=>keys[key]=false;
 b.addEventListener('pointerup',release);
 b.addEventListener('pointercancel',release);
 b.addEventListener('lostpointercapture',release);
}
hold('up','w');
hold('down','s');
hold('left','a');
hold('right','d');
hold('run','shift');
document.getElementById('jump').addEventListener('pointerdown',e=>{
 e.preventDefault();
 if(player.position.y<=heightAt(player.position.x,player.position.z)+.05 && velocityY===0){
  velocityY=7.2;
 }
});

// MOVEMENT WITH ACCELERATION AND SMOOTH STOP
let velocity=new THREE.Vector3();
let velocityY=0;
let walkSpeed=5.2;
let runSpeed=9.5;
let isMoving=false;
let elapsed=0;
const clock=new THREE.Clock();
const cameraTarget=new THREE.Vector3();

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 elapsed+=dt;

 let ix=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
 let iz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);

 const input=new THREE.Vector3(ix,0,iz);
 if(input.length()>1)input.normalize();

 const running=keys.shift;
 const targetSpeed=running?runSpeed:walkSpeed;
 const targetVelocity=input.multiplyScalar(targetSpeed);

 const acceleration=isMoving?9:7;
 velocity.x=THREE.MathUtils.damp(velocity.x,targetVelocity.x,acceleration,dt);
 velocity.z=THREE.MathUtils.damp(velocity.z,targetVelocity.z,acceleration,dt);

 isMoving=Math.abs(velocity.x)+Math.abs(velocity.z)>.15;

 player.position.x+=velocity.x*dt;
 player.position.z+=velocity.z*dt;

 const groundY=heightAt(player.position.x,player.position.z);
 velocityY-=19*dt;
 player.position.y+=velocityY*dt;
 if(player.position.y<groundY){
  player.position.y=groundY;
  velocityY=0;
 }

 // TURN TOWARD THE DIRECTION OF TRAVEL
 if(isMoving){
  const targetAngle=Math.atan2(velocity.x,-velocity.z);
  let diff=THREE.MathUtils.euclideanModulo(targetAngle-player.rotation.y+Math.PI,Math.PI*2)-Math.PI;
  player.rotation.y+=diff*Math.min(1,dt*9);
 }

 // NATURAL WALK / RUN ANIMATION
 const speed=velocity.length();
 const swing=isMoving?Math.sin(elapsed*(running?12:8))*Math.min(1,speed/5):0;
 legs[0].rotation.x=swing*.65;
 legs[1].rotation.x=-swing*.65;
 arms[0].rotation.x=-swing*.5;
 arms[1].rotation.x=swing*.5;
 player.position.y+=isMoving?Math.abs(Math.sin(elapsed*(running?12:8)))*.025:0;

 // CAMERA FOLLOWS SMOOTHLY
 const behind=10;
 const camX=player.position.x+Math.sin(player.rotation.y)*behind;
 const camZ=player.position.z+Math.cos(player.rotation.y)*behind;
 cameraTarget.set(camX,player.position.y+5.5,camZ);
 camera.position.lerp(cameraTarget,1-Math.exp(-4*dt));
 const look=new THREE.Vector3(player.position.x,player.position.y+2,player.position.z);
 camera.lookAt(look);

 // BIRDS AND CLOUDS MOVE
 for(const item of birds){
  const b=item.bird;
  b.position.x+=Math.sin(elapsed*.35+item.phase)*dt*2;
  b.position.z+=item.speed*dt;
  b.position.y+=Math.sin(elapsed*2+item.phase)*dt*.5;
  if(b.position.z>player.position.z+100)b.position.z=player.position.z-150;
 }
 for(const c of clouds){
  c.position.x+=dt*.7;
  if(c.position.x>player.position.x+300)c.position.x=player.position.x-300;
 }

 updateWorld();
 renderer.render(scene,camera);
}

updateWorld();
animate();
document.getElementById('loading').style.display='none';

onresize=()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
};
</script>
</body>
</html>
