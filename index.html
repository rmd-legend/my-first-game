<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adventure World</title>
<style>
html,body{margin:0;overflow:hidden;background:#87ceeb}
#info{position:fixed;top:12px;left:12px;color:white;font:bold 16px Arial;text-shadow:1px 2px 4px black;z-index:2}
#controls{position:fixed;bottom:25px;left:20px;right:20px;display:flex;justify-content:space-between;z-index:3}
button{width:65px;height:65px;border:2px solid white;border-radius:50%;background:#2229;color:white;font-size:25px}
</style>
</head>
<body>
<div id="info">ADVENTURE WORLD</div>
<div id="controls">
<div>
<button id="left">◀</button>
<button id="right">▶</button>
</div>
<div>
<button id="forward">▲</button>
<button id="back">▼</button>
<button id="jump">⬆</button>
</div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,40,180);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x526b39,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(30,60,20);
sun.castShadow=true;
scene.add(sun);

// Ground
const ground=new THREE.Mesh(
new THREE.PlaneGeometry(300,300),
new THREE.MeshStandardMaterial({color:0x477b39})
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

// Mountains
for(let i=0;i<18;i++){
const h=12+Math.random()*22;
const m=new THREE.Mesh(
new THREE.ConeGeometry(10+Math.random()*8,h,5),
new THREE.MeshStandardMaterial({color:0x68756b})
);
m.position.set((Math.random()-.5)*180,h/2-1,-65-Math.random()*90);
m.castShadow=true;
scene.add(m);
}

// Trees
function tree(x,z){
const trunk=new THREE.Mesh(
new THREE.CylinderGeometry(.45,.7,5,7),
new THREE.MeshStandardMaterial({color:0x654321})
);
trunk.position.set(x,2.5,z);
trunk.castShadow=true;
scene.add(trunk);

for(let i=0;i<3;i++){
const leaves=new THREE.Mesh(
new THREE.ConeGeometry(3.3-i*.45,5,7),
new THREE.MeshStandardMaterial({color:0x176b32})
);
leaves.position.set(x,5+i*1.6,z);
leaves.castShadow=true;
scene.add(leaves);
}
}
for(let i=0;i<65;i++)tree((Math.random()-.5)*110,(Math.random()-.5)*110);

// River
const river=new THREE.Mesh(
new THREE.PlaneGeometry(16,180),
new THREE.MeshStandardMaterial({color:0x218dcc,roughness:.25,metalness:.15})
);
river.rotation.x=-Math.PI/2;
river.position.set(25,.04,0);
scene.add(river);

// Bridge
const bridge=new THREE.Mesh(
new THREE.BoxGeometry(22,.7,5),
new THREE.MeshStandardMaterial({color:0x795438})
);
bridge.position.set(25,.6,0);
scene.add(bridge);

// Rocks
for(let i=0;i<25;i++){
const rock=new THREE.Mesh(
new THREE.DodecahedronGeometry(1+Math.random()*2,1),
new THREE.MeshStandardMaterial({color:0x777777})
);
rock.position.set((Math.random()-.5)*100,.8,(Math.random()-.5)*100);
rock.castShadow=true;
scene.add(rock);
}

// Temporary player character
const player=new THREE.Group();
const skin=new THREE.MeshStandardMaterial({color:0xd99a70});
const shirt=new THREE.MeshStandardMaterial({color:0x2456a5});
const pants=new THREE.MeshStandardMaterial({color:0x252b38});

const body=new THREE.Mesh(new THREE.BoxGeometry(1,1.5,.55),shirt);
body.position.y=2;
player.add(body);

const head=new THREE.Mesh(new THREE.SphereGeometry(.42,16,16),skin);
head.position.y=3.05;
player.add(head);

const legs=[];
for(let x of [-.27,.27]){
const leg=new THREE.Mesh(new THREE.BoxGeometry(.35,1,.4),pants);
leg.position.set(x,.75,0);
player.add(leg);legs.push(leg);
}
scene.add(player);
player.position.set(0,0,0);

// Movement
const keys={};
onkeydown=e=>keys[e.key.toLowerCase()]=true;
onkeyup=e=>keys[e.key.toLowerCase()]=false;

let moving=false,velocityY=0;
function bind(id,key){
const b=document.getElementById(id);
b.onpointerdown=e=>{e.preventDefault();keys[key]=true};
b.onpointerup=b.onpointerleave=b.onpointercancel=()=>keys[key]=false;
}
bind('left','a');bind('right','d');
bind('forward','w');bind('back','s');

document.getElementById('jump').onpointerdown=()=>{
if(player.position.y<=0.01)velocityY=9;
};

const clock=new THREE.Clock();
function animate(){
requestAnimationFrame(animate);
const dt=Math.min(clock.getDelta(),.04);
moving=false;

if(keys.w||keys.arrowup){player.position.z-=12*dt;moving=true}
if(keys.s||keys.arrowdown){player.position.z+=12*dt;moving=true}
if(keys.a||keys.arrowleft){player.position.x-=12*dt;moving=true}
if(keys.d||keys.arrowright){player.position.x+=12*dt;moving=true}

if(moving){
const angle=Math.atan2(
(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),
(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)
);
player.rotation.y=angle;
}

velocityY-=22*dt;
player.position.y+=velocityY*dt;
if(player.position.y<0){player.position.y=0;velocityY=0}

camera.position.lerp(
new THREE.Vector3(player.position.x,player.position.y+7,player.position.z+11),.08
);
camera.lookAt(player.position.x,player.position.y+1.5,player.position.z);

renderer.render(scene,camera);
}
animate();

onresize=()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
};
</script>
</body>
</html>
