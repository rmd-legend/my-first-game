<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>King of Trees - 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#07120e;font-family:Arial}
#info{
position:fixed;top:18px;left:0;width:100%;
text-align:center;color:#b8f5d9;
letter-spacing:4px;font-size:20px;
text-shadow:0 0 15px #24ffc1;
pointer-events:none
}
#help{
position:fixed;bottom:15px;width:100%;
text-align:center;color:#d5e9df;font-size:12px;
pointer-events:none
}
</style>
</head>
<body>
<div id="info">KING OF TREES</div>
<div id="help">DRAG TO LOOK • PINCH TO ZOOM</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07150f);
scene.fog = new THREE.FogExp2(0x07150f,0.009);

const camera = new THREE.PerspectiveCamera(
60,innerWidth/innerHeight,0.1,1500
);
camera.position.set(0,30,115);
camera.lookAt(0,35,0);

const renderer = new THREE.WebGLRenderer({
antialias:true
});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x9bc9bd,0x18251a,2));

const moon=new THREE.DirectionalLight(0xc4f6e5,2.5);
moon.position.set(-80,150,100);
moon.castShadow=true;
scene.add(moon);

// Ground
const ground=new THREE.Mesh(
new THREE.CircleGeometry(180,64),
new THREE.MeshStandardMaterial({
color:0x172b1c,roughness:1
})
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-1;
ground.receiveShadow=true;
scene.add(ground);

// Tree group
const tree=new THREE.Group();
scene.add(tree);

const bark=new THREE.MeshStandardMaterial({
color:0x49301e,roughness:0.95
});

const leafMaterial=new THREE.MeshStandardMaterial({
color:0x164c38,
emissive:0x087d69,
emissiveIntensity:0.65,
roughness:0.8
});

const blueLeaf=new THREE.MeshStandardMaterial({
color:0x55e9dc,
emissive:0x16cfc9,
emissiveIntensity:2.5,
roughness:0.5
});

// Main trunk
const trunk=new THREE.Mesh(
new THREE.CylinderGeometry(7,13,65,20,8),
bark
);
trunk.position.y=32;
trunk.castShadow=true;
tree.add(trunk);

// Roots spreading underground and above ground
for(let i=0;i<22;i++){
const a=i*Math.PI*2/22;
const root=new THREE.Mesh(
new THREE.CylinderGeometry(0.4,3,27,10),
bark
);
root.position.set(
Math.cos(a)*12,1,Math.sin(a)*12
);
root.rotation.z=Math.cos(a)*0.8;
root.rotation.x=Math.sin(a)*0.8;
root.castShadow=true;
tree.add(root);
}

// Giant spreading branches
for(let i=0;i<18;i++){
const a=i*Math.PI*2/18;
const length=35+Math.random()*22;

const branch=new THREE.Mesh(
new THREE.CylinderGeometry(0.8,3.5,length,12),
bark
);
branch.position.set(
Math.cos(a)*length*0.35,
55+Math.random()*15,
Math.sin(a)*length*0.35
);
branch.rotation.z=-Math.cos(a)*0.9;
branch.rotation.x=Math.sin(a)*0.9;
branch.castShadow=true;
tree.add(branch);
}

// Giant canopy clusters
for(let i=0;i<75;i++){
const a=Math.random()*Math.PI*2;
const r=12+Math.random()*48;
const y=75+Math.random()*32;

const leaf=new THREE.Mesh(
new THREE.IcosahedronGeometry(
7+Math.random()*7,1
),
Math.random()<0.18?blueLeaf:leafMaterial
);
leaf.position.set(
Math.cos(a)*r,y,Math.sin(a)*r
);
leaf.scale.y=0.55+Math.random()*0.5;
leaf.castShadow=true;
tree.add(leaf);
}

// Glowing magical leaves
for(let i=0;i<100;i++){
const a=Math.random()*Math.PI*2;
const r=12+Math.random()*45;
const leaf=new THREE.Mesh(
new THREE.SphereGeometry(0.35+Math.random()*0.5,8,8),
blueLeaf
);
leaf.position.set(
Math.cos(a)*r,
70+Math.random()*45,
Math.sin(a)*r
);
tree.add(leaf);
}

// Magical floating particles
const particles=[];
const particleGeometry=new THREE.SphereGeometry(0.25,6,6);
const particleMaterial=new THREE.MeshBasicMaterial({
color:0x55f7d9
});

for(let i=0;i<130;i++){
const p=new THREE.Mesh(
particleGeometry,particleMaterial
);
p.position.set(
(Math.random()-0.5)*120,
Math.random()*110,
(Math.random()-0.5)*100
);
p.userData.speed=0.02+Math.random()*0.05;
scene.add(p);
particles.push(p);
}

// Camera touch controls
let dragging=false,lastX=0,lastY=0;
let angle=0,tilt=0.25,distance=115;

renderer.domElement.addEventListener('pointerdown',e=>{
dragging=true;lastX=e.clientX;lastY=e.clientY;
});
window.addEventListener('pointerup',()=>dragging=false);
window.addEventListener('pointermove',e=>{
if(!dragging)return;
angle-=(e.clientX-lastX)*0.005;
tilt=Math.max(-0.1,Math.min(0.9,
tilt+(e.clientY-lastY)*0.003));
lastX=e.clientX;lastY=e.clientY;
});
renderer.domElement.addEventListener('wheel',e=>{
distance=Math.max(55,Math.min(180,distance+e.deltaY*0.08));
});

// Animation
function animate(){
requestAnimationFrame(animate);

const target=new THREE.Vector3(0,50,0);
camera.position.set(
Math.sin(angle)*distance*Math.cos(tilt),
50+Math.sin(tilt)*distance,
Math.cos(angle)*distance*Math.cos(tilt)
);
camera.lookAt(target);

particles.forEach(p=>{
p.position.y+=p.userData.speed;
if(p.position.y>115)p.position.y=0;
});

tree.rotation.y+=0.0004;
renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
