<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ancient Tree World</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  overflow: hidden;
  background: #07131a;
  font-family: Arial, sans-serif;
  touch-action: none;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

#title {
  position: fixed;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  color: #d9faff;
  font-size: 17px;
  letter-spacing: 3px;
  text-shadow: 0 0 12px #00cfff;
  pointer-events: none;
}

#help {
  position: fixed;
  top: 48px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  font-size: 11px;
  opacity: .75;
  pointer-events: none;
  white-space: nowrap;
}

#joystick {
  position: fixed;
  bottom: 25px;
  left: 25px;
  width: 125px;
  height: 125px;
  border-radius: 50%;
  background: #ffffff22;
  border: 2px solid #ffffff66;
  touch-action: none;
}

#stick {
  position: absolute;
  width: 48px;
  height: 48px;
  left: 36px;
  top: 36px;
  border-radius: 50%;
  background: #b8efffbb;
  border: 2px solid white;
  box-shadow: 0 0 15px #00cfff;
}

#jump {
  position: fixed;
  bottom: 42px;
  right: 28px;
  width: 85px;
  height: 85px;
  border-radius: 50%;
  border: 2px solid #b5efff;
  background: #087daaaa;
  color: white;
  font-size: 16px;
  font-weight: bold;
  box-shadow: 0 0 20px #00bfff88;
  touch-action: none;
}

#status {
  position: fixed;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  font-size: 10px;
  opacity: .65;
  pointer-events: none;
}
</style>
</head>

<body>

<div id="title">ANCIENT TREE WORLD</div>
<div id="help">DRAG SCREEN TO LOOK AROUND</div>

<div id="joystick">
  <div id="stick"></div>
</div>

<button id="jump">JUMP</button>
<div id="status">FIRST PERSON EXPLORATION</div>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* ---------------- SCENE ---------------- */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x8db6c4);
scene.fog = new THREE.Fog(0x8db6c4, 100, 330);

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  500
);

camera.rotation.order = "YXZ";

const renderer = new THREE.WebGLRenderer({
  antialias: false,
  powerPreference: "high-performance"
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.25));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

/* ---------------- LIGHTING ---------------- */

scene.add(new THREE.HemisphereLight(0xc8edff, 0x263d23, 2));

const sunlight = new THREE.DirectionalLight(0xffedce, 2);
sunlight.position.set(-70, 100, 50);
scene.add(sunlight);

/* ---------------- MATERIALS ---------------- */

const groundMaterial = new THREE.MeshStandardMaterial({
  color: 0x426d3b,
  roughness: 1
});

const trunkMaterial = new THREE.MeshStandardMaterial({
  color: 0x54351f,
  roughness: 1
});

const rootMaterial = new THREE.MeshStandardMaterial({
  color: 0x604027,
  roughness: 1
});

const leafMaterial = new THREE.MeshStandardMaterial({
  color: 0x123e36,
  roughness: 1
});

const blueLeafMaterial = new THREE.MeshStandardMaterial({
  color: 0x19bfff,
  emissive: 0x007dbb,
  emissiveIntensity: 1.8,
  roughness: 0.5
});

/* ---------------- GROUND ---------------- */

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(500, 500),
  groundMaterial
);

ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
scene.add(ground);

/* ---------------- DISTANT MOUNTAINS ---------------- */

function createMountain(x, z, height, radius) {
  const mesh = new THREE.Mesh(
    new THREE.ConeGeometry(radius, height, 7),
    new THREE.MeshStandardMaterial({
      color: 0x526c72,
      roughness: 1
    })
  );

  mesh.position.set(x, height / 2 - 2, z);
  scene.add(mesh);
}

for (let i = 0; i < 22; i++) {
  const angle = i / 22 * Math.PI * 2;
  const distance = 180 + Math.random() * 45;

  createMountain(
    Math.sin(angle) * distance,
    Math.cos(angle) * distance,
    45 + Math.random() * 65,
    25 + Math.random() * 25
  );
}

/* ---------------- ANCIENT TREE ---------------- */

const tree = new THREE.Group();
scene.add(tree);

/* Main Trunk */

const trunk = new THREE.Mesh(
  new THREE.CylinderGeometry(8, 14, 65, 12),
  trunkMaterial
);

trunk.position.y = 32.5;
tree.add(trunk);

/* Extra Trunk Details */

for (let i = 0; i < 12; i++) {
  const angle = i / 12 * Math.PI * 2;

  const detail = new THREE.Mesh(
    new THREE.CylinderGeometry(1.2, 2.5, 55, 5),
    rootMaterial
  );

  detail.position.set(
    Math.cos(angle) * 5,
    32,
    Math.sin(angle) * 5
  );

  detail.rotation.z = Math.sin(angle) * 0.08;
  tree.add(detail);
}

/* Giant Roots */

for (let i = 0; i < 18; i++) {
  const angle = i / 18 * Math.PI * 2;

  const root = new THREE.Mesh(
    new THREE.CylinderGeometry(0.4, 3.5, 24, 7),
    rootMaterial
  );

  root.position.set(
    Math.cos(angle) * 12,
    1.2,
    Math.sin(angle) * 12
  );

  root.rotation.z = Math.cos(angle) * 0.9;
  root.rotation.x = Math.sin(angle) * 0.9;

  tree.add(root);
}

/* Giant Branches */

for (let i = 0; i < 13; i++) {
  const angle = i / 13 * Math.PI * 2;

  const branch = new THREE.Mesh(
    new THREE.CylinderGeometry(1.2, 4, 29, 7),
    trunkMaterial
  );

  branch.position.set(
    Math.cos(angle) * 14,
    49 + Math.random() * 12,
    Math.sin(angle) * 14
  );

  branch.rotation.z = Math.cos(angle) * 1.1;
  branch.rotation.x = Math.sin(angle) * 1.1;

  tree.add(branch);
}

/* Large Green Canopy */

for (let i = 0; i < 48; i++) {
  const angle = Math.random() * Math.PI * 2;
  const distance = Math.random() * 32;

  const canopy = new THREE.Mesh(
    new THREE.SphereGeometry(
      10 + Math.random() * 9,
      8,
      7
    ),
    leafMaterial
  );

  canopy.position.set(
    Math.cos(angle) * distance,
    65 + Math.random() * 30,
    Math.sin(angle) * distance
  );

  canopy.scale.y = 0.8 + Math.random() * 0.5;
  tree.add(canopy);
}

/* Glowing Blue Leaves */

const glowingLeaves = [];

for (let i = 0; i < 100; i++) {
  const leaf = new THREE.Mesh(
    new THREE.OctahedronGeometry(
      0.35 + Math.random() * 0.5
    ),
    blueLeafMaterial
  );

  const angle = Math.random() * Math.PI * 2;
  const distance = 12 + Math.random() * 32;

  leaf.position.set(
    Math.cos(angle) * distance,
    58 + Math.random() * 40,
    Math.sin(angle) * distance
  );

  tree.add(leaf);
  glowingLeaves.push(leaf);
}

/* ---------------- FOREST ---------------- */

function createForestTree(x, z, scale) {
  const group = new THREE.Group();

  const stem = new THREE.Mesh(
    new THREE.CylinderGeometry(0.5, 1.2, 9, 6),
    trunkMaterial
  );

  stem.position.y = 4.5;
  group.add(stem);

  const crown = new THREE.Mesh(
    new THREE.ConeGeometry(4.5, 13, 7),
    new THREE.MeshStandardMaterial({
      color: 0x174b35,
      roughness: 1
    })
  );

  crown.position.y = 12;
  group.add(crown);

  group.position.set(x, 0, z);
  group.scale.setScalar(scale);

  scene.add(group);
}

for (let i = 0; i < 95; i++) {
  const angle = Math.random() * Math.PI * 2;
  const distance = 35 + Math.random() * 115;

  createForestTree(
    Math.cos(angle) * distance,
    Math.sin(angle) * distance,
    0.7 + Math.random() * 1.5
  );
}

/* ---------------- MAGICAL PARTICLES ---------------- */

const particles = [];

for (let i = 0; i < 45; i++) {
  const particle = new THREE.Mesh(
    new THREE.SphereGeometry(0.16, 6, 6),
    new THREE.MeshBasicMaterial({
      color: 0x65dfff
    })
  );

  particle.position.set(
    (Math.random() - 0.5) * 65,
    Math.random() * 55,
    (Math.random() - 0.5) * 65
  );

  scene.add(particle);
  particles.push(particle);
}

/* ---------------- PLAYER ---------------- */

const player = {
  x: 0,
  y: 1.7,
  z: 115,
  velocityY: 0,
  grounded: true
};

let yaw = 0;
let pitch = 0;

camera.position.set(player.x, player.y, player.z);
camera.rotation.set(0, 0, 0);

/* ---------------- MOVEMENT INPUT ---------------- */

const keys = {};

window.addEventListener("keydown", (event) => {
  keys[event.key.toLowerCase()] = true;

  if (event.code === "Space") {
    event.preventDefault();
    jump();
  }
});

window.addEventListener("keyup", (event) => {
  keys[event.key.toLowerCase()] = false;
});

/* ---------------- JOYSTICK ---------------- */

const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

let joyX = 0;
let joyY = 0;
let joystickActive = false;

function updateJoystick(event) {
  const rect = joystick.getBoundingClientRect();

  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;

  let dx = event.clientX - centerX;
  let dy = event.clientY - centerY;

  const max = 38;
  const length = Math.hypot(dx, dy);

  if (length > max) {
    dx = dx / length * max;
    dy = dy / length * max;
  }

  joyX = dx / max;
  joyY = dy / max;

  stick.style.transform =
    `translate(${dx}px, ${dy}px)`;
}

joystick.addEventListener("pointerdown", (event) => {
  event.preventDefault();
  event.stopPropagation();

  joystickActive = true;
  joystick.setPointerCapture(event.pointerId);
  updateJoystick(event);
});

joystick.addEventListener("pointermove", (event) => {
  if (!joystickActive) return;

  event.preventDefault();
  event.stopPropagation();

  updateJoystick(event);
});

function resetJoystick() {
  joystickActive = false;
  joyX = 0;
  joyY = 0;
  stick.style.transform = "translate(0px, 0px)";
}

joystick.addEventListener("pointerup", resetJoystick);
joystick.addEventListener("pointercancel", resetJoystick);

/* ---------------- JUMP ---------------- */

function jump() {
  if (player.grounded) {
    player.velocityY = 8;
    player.grounded = false;
  }
}

document.getElementById("jump").addEventListener(
  "pointerdown",
  (event) => {
    event.preventDefault();
    event.stopPropagation();
    jump();
  }
);

/* ---------------- LOOK AROUND ---------------- */

let looking = false;
let lastX = 0;
let lastY = 0;

renderer.domElement.addEventListener("pointerdown", (event) => {
  looking = true;
  lastX = event.clientX;
  lastY = event.clientY;

  renderer.domElement.setPointerCapture(event.pointerId);
});

renderer.domElement.addEventListener("pointermove", (event) => {
  if (!looking) return;

  const dx = event.clientX - lastX;
  const dy = event.clientY - lastY;

  lastX = event.clientX;
  lastY = event.clientY;

  yaw -= dx * 0.004;
  pitch -= dy * 0.004;

  pitch = Math.max(
    -1.35,
    Math.min(1.35, pitch)
  );
});

renderer.domElement.addEventListener("pointerup", () => {
  looking = false;
});

renderer.domElement.addEventListener("pointercancel", () => {
  looking = false;
});

/* ---------------- ANIMATION ---------------- */

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.04);

  /* Keyboard Movement */

  let forward = 0;
  let sideways = 0;

  if (keys["w"] || keys["arrowup"]) forward += 1;
  if (keys["s"] || keys["arrowdown"]) forward -= 1;
  if (keys["a"] || keys["arrowleft"]) sideways -= 1;
  if (keys["d"] || keys["arrowright"]) sideways += 1;

  /* Joystick Movement */

  forward += -joyY;
  sideways += joyX;

  const length = Math.hypot(forward, sideways);

  if (length > 1) {
    forward /= length;
    sideways /= length;
  }

  const speed = 15;

  const moveX =
    Math.sin(yaw) * forward +
    Math.cos(yaw) * sideways;

  const moveZ =
    -Math.cos(yaw) * forward +
    Math.sin(yaw) * sideways;

  player.x += moveX * speed * delta;
  player.z += moveZ * speed * delta;

  /* World Boundary */

  player.x = THREE.MathUtils.clamp(player.x, -220, 220);
  player.z = THREE.MathUtils.clamp(player.z, -220, 220);

  /* Jump Physics */

  if (!player.grounded) {
    player.velocityY -= 20 * delta;
    player.y += player.velocityY * delta;

    if (player.y <= 1.7) {
      player.y = 1.7;
      player.velocityY = 0;
      player.grounded = true;
    }
  }

  /* First Person Camera */

  camera.position.set(
    player.x,
    player.y,
    player.z
  );

  camera.rotation.set(
    pitch,
    yaw,
    0
  );

  /* Floating Particles */

  for (const particle of particles) {
    particle.position.y += delta * 0.7;

    if (particle.position.y > 60) {
      particle.position.y = 1;
    }
  }

  /* Glowing Leaf Animation */

  const time = clock.elapsedTime;

  for (let i = 0; i < glowingLeaves.length; i++) {
    const leaf = glowingLeaves[i];

    leaf.rotation.y += delta * 0.5;
    leaf.position.y += Math.sin(time + i) * delta * 0.08;
  }

  renderer.render(scene, camera);
}

animate();

/* ---------------- RESIZE ---------------- */

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 1.25)
  );
});

</script>
</body>
</html>
